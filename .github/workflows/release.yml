name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Building, packing, installing and linking the packages executes repository
  # and packed-package code, so it runs in its own read-only job: no publish
  # credentials, no write scopes and no `id-token`, which keeps npm provenance
  # minting out of reach of anything this job runs.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify packed packages
        run: |
          yarn build
          yarn run check:ranges
          yarn run check:install

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changesets action pushes the version branch and the
          # `<package>@<version>` tags that identify what a release was built
          # from, so it needs the credentials to stay in the git config.
          persist-credentials: true

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create release or publish packages
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        with:
          version: yarn changeset version
          publish: yarn release

      - name: Check that the release is tagged
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          git fetch --tags --quiet
          missing=0
          while read -r tag; do
            if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
              echo "tagged ${tag}"
            else
              echo "::error::${tag} was published but not tagged"
              missing=1
            fi
          done < <(node -e 'for (const p of JSON.parse(process.env.PUBLISHED_PACKAGES || "[]")) console.log(p.name + "@" + p.version)')
          exit "${missing}"

      # Tags pushed with GITHUB_TOKEN do not start a workflow run, so the
      # verification cannot rely on the `Verify release` tag trigger.
      - name: Compare the published packages with this revision
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/verify-published.mjs
