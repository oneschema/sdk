name: Release

on:
  push:
    branches:
      - release/0.7

concurrency:
  # A main run waiting for release environment approval must not block release/0.7.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Building, packing, installing and linking the packages executes repository
  # and packed-package code, so it runs in its own read-only job: no publish
  # credentials, no write scopes and no `id-token`, which keeps npm provenance
  # minting out of reach of anything this job runs.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify packed packages
        run: |
          yarn build
          yarn run check:ranges
          yarn run check:install

  release:
    needs: verify
    runs-on: ubuntu-latest
    # npm's trusted publisher for each package requires this environment, and
    # the environment allows `main` and `release/0.7`, so an OIDC token that
    # npm accepts cannot be minted from another branch that rewrote this workflow.
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Events caused by GITHUB_TOKEN don't start workflow runs, so a Version
      # Packages PR opened or pushed with it never gets ci.yml and its required
      # actionlint, build-and-lint, and bundle-size checks. The oneschema-dev
      # App token avoids that; without the App configured, this job falls back
      # to GITHUB_TOKEN.
      - name: Check GitHub App configuration
        id: app-config
        env:
          APP_CLIENT_ID: ${{ vars.ONESCHEMA_DEV_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ONESCHEMA_DEV_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ONESCHEMA_DEV_APP_CLIENT_ID / ONESCHEMA_DEV_APP_PRIVATE_KEY are not configured; falling back to GITHUB_TOKEN, so the Version Packages PR will not get CI runs (close and reopen it to trigger them)."
          fi

      - name: Create GitHub App installation token
        id: app-token
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ONESCHEMA_DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.ONESCHEMA_DEV_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changesets action pushes the version branch and the
          # `<package>@<version>` tags that identify what a release was built
          # from, so it needs the credentials to stay in the git config. When
          # configured, the persisted credentials are the App token, so the
          # version-branch push and tags come from the App.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          # No `registry-url`: it writes `_authToken=${NODE_AUTH_TOKEN}` into the
          # npmrc, and an empty token there makes npm take the token path
          # instead of exchanging its OIDC credential. The publish goes to the
          # default registry, registry.npmjs.org, either way.

      - name: Install dependencies
        run: yarn install --immutable

      # Every unpublished package must be newer than npm's latest to promote
      # this publish to latest. A 0.7.x publish to latest doesn't advance the
      # release-0.7 tag; it catches up after 1.0, while ^0.7 ranges are unaffected.
      # Registry errors fail the job before anything publishes.
      - name: Choose the npm dist-tag
        id: dist-tag
        run: |
          set -euo pipefail
          tag="$(node scripts/release-dist-tag.mjs)"
          echo "npm dist-tag for this publish: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Record Latest before publishing because the changesets step moves the badge.
      # A 404 means no Latest release exists yet.
      - name: Record the current Latest release
        id: latest-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/latest-release.err"
          if id="$(gh api "repos/${REPOSITORY}/releases/latest" --jq .id 2> "$error_file")"; then
            echo "id=${id}" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" "$error_file"; then
            echo "No Latest release yet"
          else
            cat "$error_file" >&2
            exit 1
          fi

      # npm authenticates this job through its trusted publisher for the
      # `oneschema/sdk` `release.yml` workflow: the OIDC token minted from
      # `id-token: write` replaces a registry token, and provenance is attested
      # automatically.
      - name: Create release or publish packages
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          RELEASE_DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        with:
          version: yarn version:packages
          publish: yarn release
          branch: release/0.7
          title: Version Packages (release/0.7)
          commit: Version Packages (release/0.7)

      # changesets/action v1.9.0 creates each GitHub release without `make_latest`,
      # so GitHub marks the newest one Latest; a `release-0.7` publish hands the
      # badge back to the release that was Latest before this run, and a `latest`
      # publish keeps it on the new release.
      - name: Keep the previous Latest release
        if: >-
          !cancelled() &&
          steps.changesets.outputs.published == 'true' &&
          steps.dist-tag.outputs.tag != 'latest' &&
          steps.latest-release.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ steps.latest-release.outputs.id }}
        run: gh api --method PATCH "repos/${REPOSITORY}/releases/${RELEASE_ID}" -f make_latest=true --jq '"Latest release stays " + .tag_name'

      - name: Check that the release is tagged
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          git fetch --tags --quiet
          # Resolve the tag names first: a malformed or empty payload has to
          # fail the release instead of leaving the loop with nothing to check.
          tags="$(node -e '
            const published = JSON.parse(process.env.PUBLISHED_PACKAGES || "null")
            if (!Array.isArray(published) || published.length === 0) {
              throw new Error("publishedPackages is not a non-empty array")
            }
            for (const p of published) {
              if (!p || typeof p.name !== "string" || !p.name || typeof p.version !== "string" || !p.version) {
                throw new Error("publishedPackages entry is missing a name or version: " + JSON.stringify(p))
              }
              console.log(p.name + "@" + p.version)
            }
          ')"
          missing=0
          while read -r tag; do
            if [ "$(git rev-parse -q --verify "refs/tags/${tag}^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "tagged ${tag}"
            else
              echo "::error::${tag} is missing or does not point at the commit it was published from"
              missing=1
            fi
          done <<< "${tags}"
          exit "${missing}"

      # App-token tags start verify-release.yml, but GITHUB_TOKEN fallback
      # tags do not, so this verifies every release regardless of the token.
      - name: Compare the published packages with this revision
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/verify-published.mjs
