name: Release

on:
  push:
    branches:
      - main

concurrency:
  # A main run waiting for release environment approval must not block release/0.7.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Building, packing, installing and linking the packages executes repository
  # and packed-package code, so it runs in its own read-only job: no publish
  # credentials, no write scopes and no `id-token`, which keeps npm provenance
  # minting out of reach of anything this job runs.
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify packed packages
        run: |
          yarn build
          yarn run check:ranges
          yarn run check:install

  release:
    needs: verify
    runs-on: ubuntu-24.04
    # npm's trusted publisher for each package requires this environment, and
    # the environment only allows `main`, so an OIDC token that npm accepts
    # cannot be minted from a branch that rewrote this workflow.
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Events caused by GITHUB_TOKEN don't start workflow runs, so a Version
      # Packages PR opened or pushed with it never gets ci.yml and its required
      # actionlint, build-and-lint, and bundle-size checks. The oneschema-dev
      # App token avoids that; without the App configured, this job falls back
      # to GITHUB_TOKEN.
      - name: Check GitHub App configuration
        id: app-config
        env:
          APP_CLIENT_ID: ${{ vars.ONESCHEMA_DEV_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ONESCHEMA_DEV_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ONESCHEMA_DEV_APP_CLIENT_ID / ONESCHEMA_DEV_APP_PRIVATE_KEY are not configured; falling back to GITHUB_TOKEN, so the Version Packages PR will not get CI runs (close and reopen it to trigger them)."
          fi

      - name: Create GitHub App installation token
        id: app-token
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ONESCHEMA_DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.ONESCHEMA_DEV_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changesets/action writes its GITHUB_TOKEN (the App token when
          # configured) to ~/.netrc for the version-branch and tag pushes, so
          # checkout doesn't persist credentials while dependencies install.
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          # No `registry-url`: it writes `_authToken=${NODE_AUTH_TOKEN}` into the
          # npmrc, and an empty token there makes npm take the token path
          # instead of exchanging its OIDC credential. The publish goes to the
          # default registry, registry.npmjs.org, either way.

      - name: Install dependencies
        run: yarn install --immutable

      # npm authenticates this job through its trusted publisher for the
      # `oneschema/sdk` `release.yml` workflow: the OIDC token minted from
      # `id-token: write` replaces a registry token, and provenance is attested
      # automatically.
      - name: Create release or publish packages
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          version: yarn version:packages
          publish: yarn release

      - name: Check that the release is tagged
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          git fetch --tags --quiet
          # Resolve the tag names first: a malformed or empty payload has to
          # fail the release instead of leaving the loop with nothing to check.
          tags="$(node -e '
            const published = JSON.parse(process.env.PUBLISHED_PACKAGES || "null")
            if (!Array.isArray(published) || published.length === 0) {
              throw new Error("publishedPackages is not a non-empty array")
            }
            for (const p of published) {
              if (!p || typeof p.name !== "string" || !p.name || typeof p.version !== "string" || !p.version) {
                throw new Error("publishedPackages entry is missing a name or version: " + JSON.stringify(p))
              }
              console.log(p.name + "@" + p.version)
            }
          ')"
          missing=0
          while read -r tag; do
            if [ "$(git rev-parse -q --verify "refs/tags/${tag}^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "tagged ${tag}"
            else
              echo "::error::${tag} is missing or does not point at the commit it was published from"
              missing=1
            fi
          done <<< "${tags}"
          exit "${missing}"

      # App-token tags start verify-release.yml, but GITHUB_TOKEN fallback
      # tags do not, so this verifies every release regardless of the token.
      - name: Compare the published packages with this revision
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/verify-published.mjs
