name: Bundle Size Comment

# Posts the bundle-size report produced by the unprivileged CI job. This
# workflow runs the trusted workflow definition from the default branch and
# never checks out or executes pull-request code; it only treats the uploaded
# JSON artifact as validated data before rendering and posting markdown.

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download bundle-size JSON report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-size-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and update bundle-size comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("fs")
            const marker = "<!-- oneschema-sdk-bundle-size -->"
            const maxBytes = 64 * 1024

            let report
            try {
              const stats = fs.statSync("bundle-size-report.json")
              if (stats.size > maxBytes) {
                core.setFailed(`Bundle-size report too large: ${stats.size} bytes`)
                return
              }
              report = JSON.parse(fs.readFileSync("bundle-size-report.json", "utf8"))
            } catch (error) {
              core.setFailed(`Invalid bundle-size report: ${error.message}`)
              return
            }

            const requiredFields = new Set([
              "name",
              "kind",
              "gzip",
              "raw",
              "baseGzip",
              "baseRaw",
              "status",
            ])
            const validKinds = new Set(["package", "file"])
            const validStatuses = new Set(["added", "removed", "changed", "unchanged"])
            const safeName = /^[@a-zA-Z0-9._/ -]+$/
            const isSize = (value) =>
              value === null || (Number.isSafeInteger(value) && value >= 0)

            if (!report || !Array.isArray(report.entries) || report.entries.length > 500) {
              core.setFailed("Bundle-size report must contain at most 500 entries")
              return
            }

            const names = new Set()
            for (const [index, entry] of report.entries.entries()) {
              if (!entry || typeof entry !== "object" || Array.isArray(entry)) {
                core.setFailed(`Bundle-size entry ${index} must be an object`)
                return
              }
              if (
                Object.keys(entry).some((field) => !requiredFields.has(field)) ||
                [...requiredFields].some((field) => !Object.prototype.hasOwnProperty.call(entry, field))
              ) {
                core.setFailed(`Bundle-size entry ${index} has an invalid shape`)
                return
              }
              if (
                typeof entry.name !== "string" ||
                entry.name.length === 0 ||
                entry.name.length > 200 ||
                !safeName.test(entry.name)
              ) {
                core.setFailed(`Bundle-size entry ${index} has an invalid name`)
                return
              }
              if (names.has(entry.name)) {
                core.setFailed(`Bundle-size report contains duplicate entry: ${entry.name}`)
                return
              }
              names.add(entry.name)
              if (!validKinds.has(entry.kind) || !validStatuses.has(entry.status)) {
                core.setFailed(`Bundle-size entry ${index} has an invalid kind or status`)
                return
              }
              if (![entry.gzip, entry.raw, entry.baseGzip, entry.baseRaw].every(isSize)) {
                core.setFailed(`Bundle-size entry ${index} has invalid sizes`)
                return
              }

              if (
                (entry.gzip === null) !== (entry.raw === null) ||
                (entry.baseGzip === null) !== (entry.baseRaw === null)
              ) {
                core.setFailed(`Bundle-size entry ${index} has incomplete size data`)
                return
              }

              const currentPresent = entry.gzip !== null && entry.raw !== null
              const basePresent = entry.baseGzip !== null && entry.baseRaw !== null
              const validStatus =
                (entry.status === "added" && currentPresent && !basePresent) ||
                (entry.status === "removed" && !currentPresent && basePresent) ||
                ((entry.status === "changed" || entry.status === "unchanged") &&
                  currentPresent &&
                  basePresent)
              if (!validStatus) {
                core.setFailed(`Bundle-size entry ${index} has inconsistent status and sizes`)
                return
              }
              if (
                entry.status === "unchanged" &&
                (entry.gzip !== entry.baseGzip || entry.raw !== entry.baseRaw)
              ) {
                core.setFailed(`Bundle-size entry ${index} is not unchanged`)
                return
              }
              if (
                entry.status === "changed" &&
                entry.gzip === entry.baseGzip &&
                entry.raw === entry.baseRaw
              ) {
                core.setFailed(`Bundle-size entry ${index} is not changed`)
                return
              }
            }

            const formatBytes = (value) =>
              value === null ? "—" : `${value.toLocaleString("en-US")} B`
            const formatDelta = (entry) => {
              if (entry.status === "added") {
                return "new"
              }
              if (entry.status === "removed") {
                return "removed"
              }
              const delta = entry.gzip - entry.baseGzip
              const percentage =
                entry.baseGzip === 0
                  ? "n/a"
                  : `${((delta / entry.baseGzip) * 100).toFixed(2)}%`
              const sign = delta > 0 ? "+" : ""
              return `${sign}${delta.toLocaleString("en-US")} B (${percentage})`
            }
            const body = [
              marker,
              "## Bundle size report",
              "",
              "| Package/file | Gzip size | Raw size | Delta vs base (gzip) |",
              "| --- | ---: | ---: | ---: |",
              ...[...report.entries]
                .sort((left, right) => left.name.localeCompare(right.name))
                .map(
                  (entry) =>
                    `| ${entry.name} | ${formatBytes(entry.gzip)} | ${formatBytes(entry.raw)} | ${formatDelta(entry)} |`,
                ),
            ].join("\n")

            const { owner, repo } = context.repo
            const run = context.payload.workflow_run

            // Derive the target PR from trusted workflow_run metadata rather
            // than any artifact contents, so a run cannot direct its report at
            // another pull request.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
              per_page: 100,
            })
            const matches = prs.filter((candidate) => candidate.head.sha === run.head_sha)
            if (matches.length !== 1) {
              core.info(
                `Expected exactly one open PR for this run's head; found ${matches.length}, skipping`,
              )
              return
            }
            const pr = matches[0]
            const prNumber = pr.number

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              })
            }
