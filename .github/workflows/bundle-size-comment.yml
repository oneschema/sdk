name: Bundle Size Comment

# Posts the bundle-size report produced by the unprivileged CI job. This
# workflow runs the trusted workflow definition from the default branch and
# never checks out or executes pull-request code; it only treats the uploaded
# report artifact as data (validated and size-bounded before posting).

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download bundle-size report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-size-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update bundle-size comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("fs")
            const marker = "<!-- oneschema-sdk-bundle-size -->"
            const maxBytes = 64 * 1024

            const stats = fs.statSync("bundle-size-report.md")
            if (stats.size > maxBytes) {
              core.setFailed(`Bundle-size report too large: ${stats.size} bytes`)
              return
            }

            const body = fs.readFileSync("bundle-size-report.md", "utf8")
            if (!body.includes(marker)) {
              core.setFailed("Bundle-size report is missing the expected marker")
              return
            }

            const { owner, repo } = context.repo
            const run = context.payload.workflow_run

            // Derive the target PR from trusted workflow_run metadata rather
            // than any artifact contents, so a run cannot direct its report at
            // another pull request.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
              per_page: 100,
            })
            const pr = prs.find((candidate) => candidate.head.sha === run.head_sha)
            if (!pr) {
              core.info("No open PR matches this run's head; skipping stale report")
              return
            }
            const prNumber = pr.number

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              })
            }
